name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck and production build
        run: npm run verify
      - name: Report release version sources (audit §3.4)
        run: |
          set -e
          grep -n '"version": "1.2.2"' package.json
          grep -n 'versionCode 5' android/app/build.gradle
          grep -n '1.2.2.*versionCode:.*5' README.md
          grep -n '1.2.2' RELEASE_QA.md
          grep -n 'versionCode.*5' RELEASE_QA.md
