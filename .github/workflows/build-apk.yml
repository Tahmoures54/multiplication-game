name: 🎣 Build Android APK / AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع بیلد'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - bundle

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Prepare Android SDK
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          command -v sdkmanager || true
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build web app
        run: npm run verify

      - name: 🔄 Capacitor sync
        run: npx cap sync android

      - name: 🔐 Configure release signing
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'bundle')) }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/fishmath-release.jks
          test -s android/app/fishmath-release.jks
          keytool -list -keystore android/app/fishmath-release.jks -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null

          umask 077
          cat > android/keystore.properties <<EOF
          storeFile=fishmath-release.jks
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF
          echo "Release keystore decoded and alias verified."

      - name: 🔑 Grant Gradle permissions
        run: chmod +x android/gradlew

      - name: 📂 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Build Debug APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 🔐 Check whether a Bazaar-enabled release can be built
        id: release_gate
        run: |
          if [ -n "$BAZAAR_RSA_PUBLIC_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Bazaar RSA secret is missing; only the debug APK will be built on this push."
          fi

      - name: 🔎 Validate Bazaar key for requested release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' }}
        run: |
          if [ -z "$BAZAAR_RSA_PUBLIC_KEY" ]; then
            echo "::error::Set the BAZAAR_RSA_PUBLIC_KEY repository secret before building a release APK."
            exit 1
          fi

      - name: 🔨 Build Release APK
        if: ${{ (github.event_name == 'push' && steps.release_gate.outputs.enabled == 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release') }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 🧪 Verify Release APK signature
        if: ${{ (github.event_name == 'push' && steps.release_gate.outputs.enabled == 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release') }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: 📦 Build Release AAB (Google Play)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'bundle' }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: 🧪 Verify Release AAB signature
        if: ${{ github.event.inputs.build_type == 'bundle' }}
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          echo "AAB signature verified."

      - name: 📤 Upload Debug APK
        if: ${{ github.event.inputs.build_type != 'release' && github.event.inputs.build_type != 'bundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: FishMath-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 📤 Upload Release APK
        if: ${{ (github.event_name == 'push' && steps.release_gate.outputs.enabled == 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release') }}
        uses: actions/upload-artifact@v4
        with:
          name: FishMath-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 📤 Upload Release AAB
        if: ${{ github.event.inputs.build_type == 'bundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: FishMath-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: ℹ️ Build Info
        run: |
          echo "✅ Build completed successfully!"
          if [ -z "$BAZAAR_RSA_PUBLIC_KEY" ]; then
            echo "::warning::Release APK was skipped because BAZAAR_RSA_PUBLIC_KEY is not configured. Do not publish an APK built without the Bazaar public key."
          fi
          find android/app/build/outputs -name "*.apk" -o -name "*.aab" 2>/dev/null | while read f; do ls -lh "$f"; done
